<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jitsi Auto Video Stream</title>

<script src="https://meet.jit.si/external_api.js"></script>

<style>
body{
font-family:Arial,Helvetica,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.controls{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
background:#6366f1;
color:white;
font-weight:600;
margin-top:10px;
}

button:hover{
background:#4f46e5;
}

input{
padding:8px;
width:100%;
margin-top:5px;
border-radius:5px;
border:none;
}

#jitsi-container{
height:650px;
border-radius:10px;
overflow:hidden;
}

.status{
margin-top:10px;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="controls">

<h2>Jitsi Video Stream Test</h2>

<label>Room Name</label>
<input id="roomName" value="video-stream-demo">

<label>Your Name</label>
<input id="userName" value="Video Bot">

<br>

<button onclick="startMeeting()">Start Meeting</button>

<div class="status" id="status"></div>

</div>

<div style="display:flex; gap:20px; flex-wrap:wrap;">

<div style="flex:2">
<div id="jitsi-container"></div>
</div>

<div style="flex:1; background:#020617; padding:10px; border-radius:10px;">
<h3 style="margin-bottom:10px;">Streaming Preview</h3>

<video id="videoPlayer"
muted
autoplay
playsinline
crossorigin="anonymous"
style="width:100%; border-radius:8px;">
</video>

<p style="font-size:12px; opacity:0.7; margin-top:6px;">
This is the video being streamed to participants.
</p>

</div>

</div>

<video id="videoPlayer" muted autoplay playsinline crossorigin="anonymous" style="display:none"></video>

<script>

let api
let videoStream
let isMeetingStarted=false

let defaultVideo="placeholder.mp4"

function updateStatus(msg){
document.getElementById("status").innerText=msg
}

function startMeeting(){

if(isMeetingStarted){
updateStatus("Meeting already running")
return
}

const room=document.getElementById("roomName").value
const user=document.getElementById("userName").value

const options={
roomName:room,
width:"100%",
height:"100%",
parentNode:document.querySelector("#jitsi-container"),
userInfo:{displayName:user},
configOverwrite:{
prejoinPageEnabled:false,
startWithAudioMuted:true,
startWithVideoMuted:false
}
}

api=new JitsiMeetExternalAPI("meet.jit.si",options)

isMeetingStarted=true

updateStatus("Joining meeting...")

api.addEventListener("videoConferenceJoined",()=>{

updateStatus("Meeting joined. Starting video stream...")

setTimeout(()=>{

loadVideo(defaultVideo)

},2000)

})

}

function loadVideo(path){

const videoPlayer=document.getElementById("videoPlayer")

videoPlayer.src=path
videoPlayer.loop=true
videoPlayer.muted=true

videoPlayer.onloadeddata=async ()=>{

try{

await videoPlayer.play()

if(videoStream){
videoStream.getTracks().forEach(t=>t.stop())
}

videoStream=videoPlayer.captureStream()

const track=videoStream.getVideoTracks()[0]

if(!track){
updateStatus("No video track detected")
return
}

api.executeCommand("replaceVideoTrack",track)

updateStatus("Streaming: "+path)

}catch(e){

updateStatus("Streaming error: "+e.message)

}

}

}

function streamVideoFromRepo(filename){

if(!isMeetingStarted){
updateStatus("Start meeting first")
return
}

loadVideo(filename)

}

</script>

</body>
</html>
