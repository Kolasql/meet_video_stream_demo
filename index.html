<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jitsi Auto Video Stream</title>

<script src="https://meet.jit.si/external_api.js"></script>

<style>
body{
font-family:Arial,Helvetica,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
}

.controls{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
background:#6366f1;
color:white;
font-weight:600;
margin-top:10px;
}

button:hover{
background:#4f46e5;
}

input{
padding:8px;
width:100%;
margin-top:5px;
border-radius:5px;
border:none;
}

#jitsi-container{
height:650px;
border-radius:10px;
overflow:hidden;
flex: 2;
}

.status{
margin-top:10px;
font-size:14px;
}

.main-layout {
  display: flex;
  gap: 20px;
  flex-direction: row;
}

.sidebar {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.preview-box {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
}

.preview-box h3 {
  margin-top: 0;
  margin-bottom: 10px;
}

#videoPlayer {
  width: 100%;
  border-radius: 8px;
  background: black;
}
</style>
</head>

<body>

<div class="container">
<div class="main-layout">

<div id="jitsi-container"></div>

<div class="sidebar">
  <div class="controls">
  <h2>Jitsi Video Stream Test</h2>
  <label>Room Name</label>
  <input id="roomName" value="video-stream-demo">
  <label>Your Name</label>
  <input id="userName" value="Video Bot">
  <br>
  <button onclick="startMeeting()">1. Start Meeting</button>
  <div class="status" id="status"></div>
  </div>

  <div class="controls" id="streamControls" style="display:none;">
    <h2>Stream Video</h2>
    
    <label>Option 1: Stream public MP4</label>
    <button onclick="streamPublicVideo('placeholder.mp4')" style="background:#0ea5e9; font-size:13px;">Stream Repo Video Player</button>
    <br><br>
    
    <label>Option 2: Stream local video from host</label>
    <input type="file" id="localVideoFile" accept="video/*" style="background:#334155; margin-bottom: 5px;">
    <button onclick="streamLocalVideo()" style="background:#10b981; font-size:13px;">Play & Screen Share Local Video</button>
    
    <div id="shareInstructions" style="display:none; margin-top:15px; background:#475569; padding:10px; border-radius:6px; font-size:13px;">
      <b>Instruction:</b> To stream local video so participants can see and hear it, a Screen Share prompt will appear. 
      <br><br>Please select <b>"Chrome Tab"</b>, pick this tab, and <u>ensure "Share tab audio" is checked!</u>
    </div>
  </div>

  <div class="preview-box">
  <h3>Video Preview</h3>
  <video id="videoPlayer" muted autoplay playsinline crossorigin="anonymous" style="display:none;"></video>
  <div id="previewStatus" style="font-size:13px; margin-top:5px; color:#94a3b8;">Waiting to start...</div>
  </div>
</div>

</div>
</div>

<script>

let api
let videoStream
let isMeetingStarted=false

let defaultVideo="placeholder.mp4"

function updateStatus(msg){
document.getElementById("status").innerText=msg
}

function startMeeting(){

if(isMeetingStarted){
updateStatus("Meeting already running")
return
}

const room=document.getElementById("roomName").value
const user=document.getElementById("userName").value

const options={
roomName:room,
width:"100%",
height:"100%",
parentNode:document.querySelector("#jitsi-container"),
userInfo:{displayName:user},
configOverwrite:{
prejoinPageEnabled:false,
startWithAudioMuted:true,
startWithVideoMuted:false
}
}

api=new JitsiMeetExternalAPI("meet.jit.si",options)

isMeetingStarted=true

updateStatus("Joining meeting...")

api.addEventListener("videoConferenceJoined",()=>{

updateStatus("Meeting joined. You can now select a video to stream.")
document.getElementById("streamControls").style.display = "block"

})

}

function loadVideo(path){

const videoPlayer=document.getElementById("videoPlayer")

videoPlayer.src=path
videoPlayer.loop=true
videoPlayer.muted=true

videoPlayer.onloadeddata=async ()=>{

try{

await videoPlayer.play()
videoPlayer.style.display="block"
document.getElementById("previewStatus").innerText = "Playing preview..."

if(path.startsWith('blob:')) {
  // For local files, start shared screen
  updateStatus("Playing local file. Waiting for Screen Share selection...")
  document.getElementById("shareInstructions").style.display = "block"
  
  // Trigger Jitsi's screen share dialog
  api.executeCommand('toggleShareScreen')
} else {
  // Generate absolute URL for the public video
  const absoluteVideoUrl = new URL(path, window.location.href).href;

  // Stream public URL natively
  api.executeCommand("startSharedVideo", absoluteVideoUrl)

  updateStatus("Streaming public video: "+absoluteVideoUrl)
}

}catch(e){

updateStatus("Streaming error: "+e.message)

}

}

function streamPublicVideo(filename){
  loadVideo(filename)
}

function streamLocalVideo(){
  const fileInput = document.getElementById("localVideoFile")
  if (!fileInput.files || fileInput.files.length === 0) {
    alert("Please select a local video file first.")
    return
  }
  
  const file = fileInput.files[0]
  const objectUrl = URL.createObjectURL(file)
  loadVideo(objectUrl)
}

}

function streamVideoFromRepo(filename){

if(!isMeetingStarted){
updateStatus("Start meeting first")
return
}

loadVideo(filename)

}

</script>

</body>
</html>
